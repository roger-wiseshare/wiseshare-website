<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>五子棋 Gomoku</title>
<style>
:root{color-scheme:light dark;--bg:#eaf3ec;--fg:#12281c;--panel:#ffffff;--line:#c4d8ca;--tag:#d5e8db;--altbg:#cfe3d6;--altfg:#12281c;--hl:#b8741a}
@media(prefers-color-scheme:dark){:root{--bg:#0d2419;--fg:#f1f5ef;--panel:#17382a;--line:#2c5d45;--tag:#1d4733;--altbg:#2c5d45;--altfg:#f1f5ef;--hl:#7dffb0}}
:root[data-theme=light]{color-scheme:light;--bg:#eaf3ec;--fg:#12281c;--panel:#ffffff;--line:#c4d8ca;--tag:#d5e8db;--altbg:#cfe3d6;--altfg:#12281c;--hl:#b8741a}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d2419;--fg:#f1f5ef;--panel:#17382a;--line:#2c5d45;--tag:#1d4733;--altbg:#2c5d45;--altfg:#f1f5ef;--hl:#7dffb0}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{padding:8px 10px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{margin:0;font-size:22px}
h1 small{font-size:13px;font-weight:400;opacity:.7;margin-left:6px}
button,select{font:inherit;border:0;border-radius:8px;padding:7px 14px;background:#e8b93a;color:#2a1e00;font-weight:700;cursor:pointer}
button.alt,select{background:var(--altbg);color:var(--altfg)}
button:disabled{opacity:.4;cursor:not-allowed}
:root{--bs:min(calc(100dvh - 76px),calc(100vw - 380px))}
#stage{display:flex;gap:16px;justify-content:center;align-items:center}
#cv{width:var(--bs);height:var(--bs);border-radius:10px;box-shadow:0 6px 24px #0007;touch-action:manipulation;cursor:pointer;flex:none}
#panel{width:340px;max-width:100%;background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
#status{font-size:18px;font-weight:700;min-height:2.6em;display:flex;align-items:center}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--tag);border:2px solid transparent}
.pl.turn{border-color:#e8b93a}
.pl span{font-weight:700}.pl em{margin-left:auto;font-style:normal;font-size:13px;opacity:.8}
.dot{width:20px;height:20px;border-radius:50%;flex:none}
.dot.b{background:radial-gradient(circle at 35% 30%,#666,#000)}
.dot.w{background:radial-gradient(circle at 35% 30%,#fff,#ccc);border:1px solid #999}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row label{font-size:13px;opacity:.85;display:flex;flex-direction:column;gap:3px;flex:1}
.row select{width:100%}
.stat{font-size:14px;text-align:center;opacity:.9}
.rule{font-size:12.5px;line-height:1.6;opacity:.8}
#modal{position:fixed;z-index:100;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.box{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;max-width:360px;width:100%}
.box input{width:100%;font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
@media(max-aspect-ratio:1/1){
  :root{--bs:min(96vw,calc(100dvh - 330px))}
  #stage{flex-direction:column;gap:10px}
  #panel{width:min(96vw,560px)}
}
@media(max-height:560px) and (min-aspect-ratio:1/1){:root{--bs:min(calc(100dvh - 56px),calc(100vw - 380px))}h1 small{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>五子棋<small>Gomoku</small></h1>
  <div><button class="alt" id="undoBtn">悔棋</button> <button class="alt" id="nameBtn">更改名稱</button> <button class="alt" id="themeBtn">外觀：自動</button> <button id="newBtn">重新開始</button></div>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="panel">
    <div id="status"></div>
    <div class="pl" id="p0"><i class="dot b" id="d0"></i><span id="n0">你</span><em id="r0"></em></div>
    <div class="pl" id="p1"><i class="dot w" id="d1"></i><span id="n1">電腦</span><em id="r1"></em></div>
    <div class="row">
      <label>執子<select id="side"><option value="B">執黑（先手）</option><option value="W">執白（後手）</option></select></label>
      <label>難度<select id="level"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select></label>
    </div>
    <div class="stat" id="stat"></div>
    <div class="rule">規則：15×15 棋盤，黑子先下。橫、直、斜任一方向連成五子（含以上）即獲勝；盤面下滿則和局。無禁手。</div>
  </div>
</div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
const N=15;
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
const DEF=['你','電腦'];
let NAMES=DEF.slice();
let G=null,GID=0;

/* ---------- 規則與 AI（純邏輯） ---------- */
function opp(p){return p==='B'?'W':'B';}
function lineStr(b,r,c,dr,dc,p,place){
  let s='';
  for(let k=-4;k<=4;k++){
    const rr=r+dr*k,cc=c+dc*k;let ch;
    if(rr<0||cc<0||rr>=N||cc>=N)ch='o';
    else if(k===0)ch=place?'x':'.';
    else{const v=b[rr*N+cc];ch=v===0?'.':(v===p?'x':'o');}
    s+=ch;
  }
  return s;
}
function pat(s){
  if(/xxxxx/.test(s))return [100000,'5'];
  if(/\.xxxx\./.test(s))return [10000,'4o'];
  if(/xxxx\.|\.xxxx|x\.xxx|xxx\.x|xx\.xx/.test(s))return [1000,'4'];
  if(/\.xxx\.|\.x\.xx\.|\.xx\.x\./.test(s))return [1000,'3o'];
  if(/xxx\.|\.xxx|x\.xx|xx\.x/.test(s))return [100,'3'];
  if(/\.xx\.|\.x\.x\./.test(s))return [100,'2o'];
  if(/xx|x\.x/.test(s))return [10,'2'];
  return [0,''];
}
function cellScore(b,r,c,p){
  let total=0,c4=0,o3=0,five=false;
  for(const [dr,dc] of DIRS){
    const a=pat(lineStr(b,r,c,dr,dc,p,true)),z=pat(lineStr(b,r,c,dr,dc,p,false));
    const gain=a[0]-z[0];
    if(gain>0){
      total+=gain;
      if(a[1]==='5')five=true;
      else if(a[1]==='4'||a[1]==='4o')c4++;
      else if(a[1]==='3o')o3++;
    }
  }
  if(c4>=2||(c4>=1&&o3>=1))total+=8000;
  else if(o3>=2)total+=2000;
  return {score:total,five};
}
function candidates(b){
  const out=[];let any=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(b[r*N+c]!==0)continue;
    let near=false;
    for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2;dc++){
      const rr=r+dr,cc=c+dc;
      if(rr>=0&&cc>=0&&rr<N&&cc<N&&b[rr*N+cc]!==0){near=true;break;}
    }
    if(near)out.push([r,c]);
  }
  for(let i=0;i<b.length;i++)if(b[i]!==0){any=true;break;}
  if(!any)out.push([7,7]);
  return out;
}
function aiMove(b,p,level){
  const cs=candidates(b);
  const q=opp(p);
  const list=[];
  for(const [r,c] of cs){
    const a=cellScore(b,r,c,p),d=cellScore(b,r,c,q);
    if(a.five)return [r,c];
    const dm=level==='easy'?0.45:0.95;
    const center=(14-Math.abs(r-7)-Math.abs(c-7))*2;
    list.push({r,c,s:a.score+d.score*dm+center+(d.five?90000:0)});
  }
  list.sort((x,y)=>y.s-x.s);
  let pick=list[0];
  if(level==='easy'){
    const k=Math.min(list.length,5);pick=list[Math.floor(Math.random()*k)];
  }else if(level==='normal'){
    const k=Math.min(list.length,3);
    pick=(list[0].s>=5000||Math.random()<.6)?list[0]:list[Math.floor(Math.random()*k)];
  }else{
    const best=list.filter(x=>x.s>=list[0].s*0.98);pick=best[Math.floor(Math.random()*best.length)];
  }
  return [pick.r,pick.c];
}
function checkWin(b,r,c){
  const p=b[r*N+c];if(!p)return null;
  for(const [dr,dc] of DIRS){
    const cells=[[r,c]];
    for(const s of [1,-1]){
      let rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&cc>=0&&rr<N&&cc<N&&b[rr*N+cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s;}
    }
    if(cells.length>=5)return cells;
  }
  return null;
}

/* ---------- 遊戲流程 ---------- */
function newGame(){
  GID++;
  const side=G?G.human:'B';
  G={board:new Array(N*N).fill(0),moves:[],turn:'B',human:side,over:false,win:null,level:G?G.level:'normal',hover:null,thinking:false,result:null,stats:G?G.stats:loadStats()};
  render();
  if(G.human==='W')aiTurn();
}
function loadStats(){try{return JSON.parse(localStorage.getItem('gomoku_stats'))||{w:0,l:0,d:0};}catch(e){return {w:0,l:0,d:0};}}
function saveStats(){try{localStorage.setItem('gomoku_stats',JSON.stringify(G.stats));}catch(e){}}
function place(r,c){
  const p=G.turn;G.board[r*N+c]=p;G.moves.push({r,c,p});
  const w=checkWin(G.board,r,c);
  if(w){G.over=true;G.win=w;G.result=p===G.human?'win':'lose';
    if(p===G.human)G.stats.w++;else G.stats.l++;saveStats();}
  else if(G.moves.length>=N*N){G.over=true;G.result='draw';G.stats.d++;saveStats();}
  else G.turn=opp(p);
}
function humanPlay(r,c){
  if(G.over||G.thinking||G.turn!==G.human||G.board[r*N+c]!==0)return;
  place(r,c);render();
  if(!G.over)aiTurn();
}
function aiTurn(){
  G.thinking=true;render();
  const id=GID;
  setTimeout(()=>{
    if(id!==GID)return;
    const [r,c]=aiMove(G.board,G.turn,G.level);
    place(r,c);G.thinking=false;render();
  },380);
}
function undo(){
  if(G.thinking||!G.moves.some(m=>m.p===G.human))return;
  if(G.over&&G.result){
    if(G.result==='win')G.stats.w--;else if(G.result==='lose')G.stats.l--;else G.stats.d--;
    saveStats();
  }
  while(G.moves.length){
    const m=G.moves.pop();G.board[m.r*N+m.c]=0;
    if(m.p===G.human)break;
  }
  G.over=false;G.win=null;G.result=null;G.turn=G.human;
  render();
}

/* ---------- 畫面 ---------- */
let cv,ctx;
function $(id){return document.getElementById(id);}
function render(){
  const g=G;
  $('n0').textContent=NAMES[0];$('n1').textContent=NAMES[1];
  const hb=g.human==='B';
  $('d0').className='dot '+(hb?'b':'w');$('d1').className='dot '+(hb?'w':'b');
  $('r0').textContent=hb?'黑子・先手':'白子・後手';$('r1').textContent=hb?'白子・後手':'黑子・先手';
  const humanTurn=!g.over&&g.turn===g.human&&!g.thinking;
  $('p0').className='pl'+(!g.over&&g.turn===g.human?' turn':'');
  $('p1').className='pl'+(!g.over&&g.turn!==g.human?' turn':'');
  let st;
  if(g.over){st=g.result==='win'?`🎉 ${NAMES[0]}獲勝！`:g.result==='lose'?`${NAMES[1]}獲勝，再接再厲！`:'棋盤已滿，和局。';}
  else if(g.thinking)st=`${NAMES[1]}思考中…`;
  else st=`輪到${NAMES[0]}（${hb?'黑':'白'}子）`;
  $('status').textContent=st;
  $('stat').textContent=`累計戰績：${g.stats.w} 勝　${g.stats.l} 敗　${g.stats.d} 和　｜　目前第 ${g.moves.length} 手`;
  $('undoBtn').disabled=g.thinking||!g.moves.some(m=>m.p===g.human);
  $('side').value=g.human;$('level').value=g.level;
  draw();
}
function draw(){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1,S=cv.clientWidth;
  if(!S)return;
  if(cv.width!==Math.round(S*dpr)){cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);}
  const g=ctx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,S,S);
  const m=S/(N+1);
  const grd=g.createLinearGradient(0,0,S,S);grd.addColorStop(0,'#e6bf74');grd.addColorStop(1,'#d3a653');
  g.fillStyle=grd;g.fillRect(0,0,S,S);
  g.strokeStyle='#5a3b12';g.lineWidth=Math.max(1,m*.04);
  g.beginPath();
  for(let i=0;i<N;i++){const p=m*(i+1);g.moveTo(m,p);g.lineTo(S-m,p);g.moveTo(p,m);g.lineTo(p,S-m);}
  g.stroke();
  g.fillStyle='#5a3b12';
  for(const [r,c] of [[3,3],[3,11],[11,3],[11,11],[7,7]]){g.beginPath();g.arc(m*(c+1),m*(r+1),m*.09,0,7);g.fill();}
  const R=m*.44;
  const stone=(r,c,p,alpha)=>{
    const x=m*(c+1),y=m*(r+1);
    g.globalAlpha=alpha;
    g.shadowColor='#0006';g.shadowBlur=alpha===1?m*.14:0;g.shadowOffsetY=alpha===1?m*.05:0;
    const rg=g.createRadialGradient(x-R*.35,y-R*.35,R*.1,x,y,R);
    if(p==='B'){rg.addColorStop(0,'#777');rg.addColorStop(1,'#000');}
    else{rg.addColorStop(0,'#fff');rg.addColorStop(1,'#cfcfcf');}
    g.fillStyle=rg;g.beginPath();g.arc(x,y,R,0,7);g.fill();
    g.shadowColor='transparent';
    if(p==='W'){g.strokeStyle='#9a9a9a';g.lineWidth=1;g.stroke();}
    g.globalAlpha=1;
  };
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=G.board[r*N+c];if(v)stone(r,c,v,1);}
  if(G.hover&&!G.over&&G.turn===G.human&&!G.thinking&&G.board[G.hover[0]*N+G.hover[1]]===0)stone(G.hover[0],G.hover[1],G.human,.45);
  const last=G.moves[G.moves.length-1];
  if(last){g.fillStyle='#e03030';g.beginPath();g.arc(m*(last.c+1),m*(last.r+1),m*.11,0,7);g.fill();}
  if(G.win){
    g.strokeStyle='#f2c230';g.lineWidth=Math.max(2,m*.1);
    for(const [r,c] of G.win){g.beginPath();g.arc(m*(c+1),m*(r+1),R+m*.03,0,7);g.stroke();}
  }
}
function cellAt(e){
  const rc=cv.getBoundingClientRect(),S=rc.width,m=S/(N+1);
  const x=(e.clientX-rc.left)/m-1,y=(e.clientY-rc.top)/m-1;
  const c=Math.round(x),r=Math.round(y);
  if(r<0||c<0||r>=N||c>=N)return null;
  if(Math.hypot(x-c,y-r)>0.55)return null;
  return [r,c];
}
let THEME='auto';
function applyTheme(){document.documentElement.setAttribute('data-theme',THEME);$('themeBtn').textContent='外觀：'+({auto:'自動',light:'淺色',dark:'深色'}[THEME]);}

function init(){
  try{const s=JSON.parse(localStorage.getItem('gomoku_names')||'null');if(Array.isArray(s)&&s.length===2)NAMES=s.map((x,i)=>String(x||'').trim().slice(0,6)||DEF[i]);}catch(e){}
  try{THEME=localStorage.getItem('gomoku_theme')||'auto';}catch(e){}
  cv=$('cv');ctx=cv.getContext('2d');
  cv.addEventListener('pointermove',e=>{if(!G)return;const c=cellAt(e);const h=G.hover;G.hover=c;if(!h!==!c||(h&&c&&(h[0]!==c[0]||h[1]!==c[1])))draw();});
  cv.addEventListener('pointerleave',()=>{G.hover=null;draw();});
  cv.addEventListener('pointerdown',e=>{const c=cellAt(e);if(c)humanPlay(c[0],c[1]);});
  window.addEventListener('resize',draw);
  $('undoBtn').onclick=undo;
  $('newBtn').onclick=()=>{if(!G.moves.length||G.over||confirm('確定要重新開始這一局嗎？'))newGame();};
  $('side').onchange=e=>{G.human=e.target.value;newGame();};
  $('level').onchange=e=>{G.level=e.target.value;};
  $('themeBtn').onclick=()=>{THEME={auto:'light',light:'dark',dark:'auto'}[THEME];try{localStorage.setItem('gomoku_theme',THEME);}catch(e){}applyTheme();};
  $('nameBtn').onclick=()=>{
    const pos=['你的名稱','對手（電腦）的名稱'];
    $('mbox').innerHTML='<h2 style="margin:0 0 10px">更改玩家名稱</h2>'+NAMES.map((n,i)=>`<p style="margin:6px 0"><label>${pos[i]}<br><input id="nm${i}" maxlength="6" value="${n.replace(/"/g,'&quot;')}"></label></p>`).join('')+'<div class="row" style="margin-top:10px"><button id="nmSave">儲存</button><button class="alt" id="nmCancel">取消</button></div><p style="font-size:12px;opacity:.7">最多 6 個字，留空則還原預設名稱。</p>';
    $('modal').className='on';
    $('nmCancel').onclick=()=>{$('modal').className='';};
    $('nmSave').onclick=()=>{
      NAMES=[0,1].map(i=>$('nm'+i).value.trim().slice(0,6)||DEF[i]);
      try{localStorage.setItem('gomoku_names',JSON.stringify(NAMES));}catch(e){}
      $('modal').className='';render();
    };
  };
  applyTheme();newGame();
}
if(typeof window!=='undefined'&&!window.__TEST__)init();
</script>
</body>
</html>
