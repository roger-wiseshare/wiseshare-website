<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>五子棋 Gomoku</title>
<style>
:root{color-scheme:light dark;--bg:#eaf3ec;--fg:#12281c;--panel:#ffffff;--line:#c4d8ca;--tag:#d5e8db;--altbg:#cfe3d6;--altfg:#12281c;--hl:#b8741a}
@media(prefers-color-scheme:dark){:root{--bg:#0d2419;--fg:#f1f5ef;--panel:#17382a;--line:#2c5d45;--tag:#1d4733;--altbg:#2c5d45;--altfg:#f1f5ef;--hl:#7dffb0}}
:root[data-theme=light]{color-scheme:light;--bg:#eaf3ec;--fg:#12281c;--panel:#ffffff;--line:#c4d8ca;--tag:#d5e8db;--altbg:#cfe3d6;--altfg:#12281c;--hl:#b8741a}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d2419;--fg:#f1f5ef;--panel:#17382a;--line:#2c5d45;--tag:#1d4733;--altbg:#2c5d45;--altfg:#f1f5ef;--hl:#7dffb0}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{padding:8px 10px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{margin:0;font-size:22px}
h1 small{font-size:13px;font-weight:400;opacity:.7;margin-left:6px}
button,select{font:inherit;border:0;border-radius:8px;padding:7px 14px;background:#e8b93a;color:#2a1e00;font-weight:700;cursor:pointer}
button.alt,select{background:var(--altbg);color:var(--altfg)}
button:disabled{opacity:.4;cursor:not-allowed}
:root{--bs:min(calc(100dvh - 76px),calc(100vw - 690px))}
#stage{display:flex;gap:16px;justify-content:center;align-items:flex-start}
#cv{width:var(--bs);height:var(--bs);border-radius:10px;box-shadow:0 6px 24px #0007;touch-action:manipulation;cursor:pointer;flex:none}
#right{width:390px;max-width:100%;flex:none;height:var(--bs);display:flex;flex-direction:column;justify-content:space-between;gap:12px}
#art{flex:1;min-height:0;background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
#artimg{flex:1;min-height:0;border-radius:10px;overflow:hidden}
#artimg svg{display:block;width:100%;height:100%}
.cap{text-align:center;font-size:16px;font-weight:700;opacity:.9}
#panel{width:100%;flex:none;background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:17px}
#status{font-size:23px;font-weight:800;min-height:2.6em;display:flex;align-items:center}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--tag);border:2px solid transparent}
.pl.turn{border-color:#e8b93a}
.pl{font-size:18px}.pl span{font-weight:700}.pl em{margin-left:auto;font-style:normal;font-size:15px;opacity:.85}
.dot{width:24px;height:24px;border-radius:50%;flex:none}
.dot.b{background:radial-gradient(circle at 35% 30%,#666,#000)}
.dot.w{background:radial-gradient(circle at 35% 30%,#fff,#ccc);border:1px solid #999}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row label{font-size:16px;opacity:.9;display:flex;flex-direction:column;gap:4px;flex:1}
.row select{width:100%;font-size:17px;padding:8px 10px}
.stat{font-size:16px;text-align:center;opacity:.95;line-height:1.5}
.rule{font-size:15px;line-height:1.65;opacity:.85}
#learn{display:flex;flex-direction:column;gap:10px;width:220px;flex:none;height:var(--bs)}
.lt{font-size:15px;font-weight:800;text-align:center}
.card{background:var(--panel);border-radius:12px;padding:8px;text-align:center;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.card canvas{height:calc((var(--bs) - 20px)/3 - 122px);width:auto;aspect-ratio:1;display:block;margin:0 auto 4px;border-radius:6px}
.card b{font-size:17px;white-space:nowrap}.card small{display:block;font-size:12.5px;line-height:1.4;opacity:.85}
#banner{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}
#banner.show{display:block}
#banner .bn{font-weight:900;white-space:nowrap;padding:.28em .8em;border-radius:.45em;border:.07em solid #f2c230;text-align:center;line-height:1.25;box-shadow:0 8px 40px #000a,0 0 60px #f2c23088;animation:pop .75s cubic-bezier(.2,1.6,.4,1) both,fade .5s 2.7s forwards}
#banner .bn small{display:block;font-size:.34em;font-weight:700;opacity:.85}
#banner.blk .bn{background:#111;color:#fff}
#banner.wht .bn{background:#fafafa;color:#111}
#banner.draw .bn{background:#355;color:#fff}
#banner i{position:absolute;left:50%;top:50%;width:.16em;height:.16em;border-radius:2px;animation:fly 1.7s ease-out both}
@keyframes pop{0%{transform:scale(0) rotate(-12deg);opacity:0}60%{transform:scale(1.25) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fade{to{opacity:0;transform:scale(1.1)}}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
#modal{position:fixed;z-index:100;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.box{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;max-width:360px;width:100%}
.box input{width:100%;font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
@media(max-aspect-ratio:1/1){
  :root{--bs:min(96vw,calc(100dvh - 520px))}
  #stage{flex-direction:column;align-items:center;gap:10px}
  #right{width:min(96vw,560px);height:auto;transform:none!important}
  #art{height:190px;flex:none}
  #learn{flex-direction:row;width:min(96vw,560px);height:auto}
  .card{flex:1;padding:4px;min-height:150px}.card canvas{width:100%;height:auto;aspect-ratio:1}.card small{font-size:11px}
}
@media(max-height:560px) and (min-aspect-ratio:1/1){:root{--bs:min(calc(100dvh - 56px),calc(100vw - 690px))}h1 small{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>五子棋<small>Gomoku</small></h1>
  <div id="hdrBtns"><button class="alt" id="undoBtn">悔棋</button> <button class="alt" id="nameBtn">更改名稱</button> <button class="alt" id="themeBtn">外觀：自動</button> <button id="newBtn">重新開始</button></div>
</header>
<div id="stage">
  <div id="learn"></div>
  <canvas id="cv"></canvas>
  <div id="right"><div id="panel">
    <div id="status"></div>
    <div class="pl" id="p0"><i class="dot b" id="d0"></i><span id="n0">你</span><em id="r0"></em></div>
    <div class="pl" id="p1"><i class="dot w" id="d1"></i><span id="n1">電腦</span><em id="r1"></em></div>
    <div class="row">
      <label>執子<select id="side"><option value="B">執黑（先手）</option><option value="W">執白（後手）</option></select></label>
      <label>難度<select id="level"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option><option value="learn">學習</option></select></label>
    </div>
    <div class="stat" id="stat"></div>
    <div class="rule">規則：15×15 棋盤，黑子先下。橫、直、斜任一方向連成五子（含以上）即獲勝；盤面下滿則和局。無禁手。</div>
  </div>
  <div id="art"><div id="artimg"><svg viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="五子棋：黑子連成五子"><defs><linearGradient id="wd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6bf74"/><stop offset="1" stop-color="#d0a24e"/></linearGradient><radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#777"/><stop offset="1" stop-color="#000"/></radialGradient><radialGradient id="gw" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfcfcf"/></radialGradient><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".4"/></filter></defs><rect width="360" height="200" fill="url(#wd)"/><g stroke="#5a3b12" stroke-width="1.3"><line x1="30.0" y1="24.0" x2="30.0" y2="176.0"/><line x1="67.5" y1="24.0" x2="67.5" y2="176.0"/><line x1="105.0" y1="24.0" x2="105.0" y2="176.0"/><line x1="142.5" y1="24.0" x2="142.5" y2="176.0"/><line x1="180.0" y1="24.0" x2="180.0" y2="176.0"/><line x1="217.5" y1="24.0" x2="217.5" y2="176.0"/><line x1="255.0" y1="24.0" x2="255.0" y2="176.0"/><line x1="292.5" y1="24.0" x2="292.5" y2="176.0"/><line x1="330.0" y1="24.0" x2="330.0" y2="176.0"/><line x1="30.0" y1="24.0" x2="330.0" y2="24.0"/><line x1="30.0" y1="54.4" x2="330.0" y2="54.4"/><line x1="30.0" y1="84.8" x2="330.0" y2="84.8"/><line x1="30.0" y1="115.19999999999999" x2="330.0" y2="115.19999999999999"/><line x1="30.0" y1="145.6" x2="330.0" y2="145.6"/><line x1="30.0" y1="176.0" x2="330.0" y2="176.0"/></g><circle cx="105.0" cy="24.0" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="142.5" cy="54.4" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="67.5" cy="54.4" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="180.0" cy="84.8" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="105.0" cy="115.19999999999999" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="255.0" cy="115.19999999999999" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="217.5" cy="115.19999999999999" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="142.5" cy="145.6" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="292.5" cy="84.8" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="180.0" cy="176.0" r="13.5" fill="url(#gw)" stroke="#999" stroke-width=".8" filter="url(#sh)"/><circle cx="67.5" cy="24.0" r="13.5" fill="url(#gb)" stroke="#000" stroke-width=".8" filter="url(#sh)"/><circle cx="105.0" cy="54.4" r="13.5" fill="url(#gb)" stroke="#000" stroke-width=".8" filter="url(#sh)"/><circle cx="142.5" cy="84.8" r="13.5" fill="url(#gb)" stroke="#000" stroke-width=".8" filter="url(#sh)"/><circle cx="180.0" cy="115.19999999999999" r="13.5" fill="url(#gb)" stroke="#000" stroke-width=".8" filter="url(#sh)"/><circle cx="217.5" cy="145.6" r="13.5" fill="url(#gb)" stroke="#000" stroke-width=".8" filter="url(#sh)"/><line x1="67.5" y1="24.0" x2="217.5" y2="145.6" stroke="#f2c230" stroke-width="5" stroke-linecap="round" opacity=".85"/><circle cx="217.5" cy="145.6" r="4" fill="#e03030"/></svg></div><div class="cap">作者：Roger Wang</div></div></div>
</div>
</div>
<div id="banner"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
const N=15;
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
const DEF=['你','電腦'];
/* 連珠起手式（黑1＝H8 天元；白2；黑3）。座標 [row,col]，row 由上往下、col 由左往右 */
const OPENINGS=[
 {n:'寒星',t:'直接 1',c:'H8・H9・H10',s:[[7,7],[6,7],[5,7]],d:'黑第三子隔著白子，與天元同在一條直線上。'},
 {n:'溪月',t:'直接 2',c:'H8・H9・I10',s:[[7,7],[6,7],[5,8]],d:'黑第三子落在白子斜上方，緊貼白子。'},
 {n:'疏星',t:'直接 3',c:'H8・H9・J10',s:[[7,7],[6,7],[5,9]],d:'黑第三子與天元同在斜線上，中間隔一格空位。'},
 {n:'長星',t:'間接 1',c:'H8・I9・J10',s:[[7,7],[6,8],[5,9]],d:'三子同在一條斜線上，白子夾在黑子中間。'},
 {n:'峽月',t:'間接 2',c:'H8・I9・J9',s:[[7,7],[6,8],[6,9]],d:'黑第三子緊貼白子右側，與白子並排。'},
 {n:'恆星',t:'間接 3',c:'H8・I9・J8',s:[[7,7],[6,8],[7,9]],d:'黑第三子與天元同在橫線上，中間隔一格空位。'}
];
let OPS=[];
function rollOps(){const a=OPENINGS.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}OPS=a.slice(0,3);}
function renderLearn(){
  const box=$('learn');if(!box)return;
  if(G.level!=='learn'){box.innerHTML='<div class="card"></div>'.repeat(3);return;}
  if(!OPS.length)rollOps();
  box.innerHTML=OPS.map((o,i)=>`<div class="card"><canvas id="oc${i}" width="256" height="256"></canvas><b>${o.n}</b>（${o.t}）<small>${o.c}<br>${o.d}</small></div>`).join('');
  OPS.forEach((o,i)=>drawOpening($('oc'+i),o));
}
function drawOpening(c,o){
  const g=c.getContext('2d'),W=c.width,n=5,r0=4,c0=6,m=W/n;
  g.fillStyle='#deb667';g.fillRect(0,0,W,W);
  g.strokeStyle='#5a3b12';g.lineWidth=2;g.beginPath();
  for(let i=0;i<n;i++){const p=m*(i+.5);g.moveTo(m*.5,p);g.lineTo(W-m*.5,p);g.moveTo(p,m*.5);g.lineTo(p,W-m*.5);}
  g.stroke();
  o.s.forEach(([r,cc],k)=>{
    const x=m*(cc-c0+.5),y=m*(r-r0+.5),R=m*.42,white=k===1;
    const rg=g.createRadialGradient(x-R*.35,y-R*.35,R*.1,x,y,R);
    if(white){rg.addColorStop(0,'#fff');rg.addColorStop(1,'#cfcfcf');}else{rg.addColorStop(0,'#777');rg.addColorStop(1,'#000');}
    g.fillStyle=rg;g.beginPath();g.arc(x,y,R,0,7);g.fill();
    if(white){g.strokeStyle='#999';g.lineWidth=1.5;g.stroke();}
    g.fillStyle=white?'#111':'#fff';g.font='bold '+Math.round(m*.42)+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText(String(k+1),x,y+1);
  });
}
function applyLevelUI(){
  renderLearn();
  layoutPanel();draw();
}
/* 設定框：頂端與棋盤上緣對齊；水平置中於上方四個按鈕 */
function layoutPanel(){
  const p=$('right'),b=$('hdrBtns');if(!p||!b)return;
  p.style.transform='';
  if(window.innerWidth<=window.innerHeight)return;
  const pr=p.getBoundingClientRect(),br=b.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  let dx=(br.left+br.width/2)-(pr.left+pr.width/2);
  dx=Math.min(dx,window.innerWidth-8-pr.right);
  dx=Math.max(dx,cr.right+12-pr.left);
  p.style.transform='translateX('+Math.round(dx)+'px)';
}
let BT=0;
function showBanner(){
  const b=$('banner');if(!b||!cv)return;
  const rc=cv.getBoundingClientRect();
  b.style.left=(rc.left+rc.width/2)+'px';b.style.top=(rc.top+rc.height/2)+'px';b.style.fontSize=Math.max(30,rc.width*.12)+'px';
  let txt,cls,sub='';
  if(G.result==='draw'){txt='和局！';cls='draw';}
  else{const p=G.moves[G.moves.length-1].p;txt=(p==='B'?'黑':'白')+'棋勝！';cls=p==='B'?'blk':'wht';sub=`<small>${p===G.human?NAMES[0]:NAMES[1]}獲勝</small>`;}
  const cols=['#f2c230','#ff5a5a','#5ad2ff','#7dff9b','#ff9bf0','#fff'];
  let cf='';
  for(let i=0;i<36;i++){const a=Math.random()*6.283,d=2.5+Math.random()*4;cf+=`<i style="background:${cols[i%cols.length]};--dx:${(Math.cos(a)*d).toFixed(2)}em;--dy:${(Math.sin(a)*d-.6).toFixed(2)}em;--rot:${Math.round(Math.random()*720-360)}deg;animation-delay:${(Math.random()*.25).toFixed(2)}s"></i>`;}
  b.className='show '+cls;b.innerHTML=`<div class="bn">${txt}${sub}</div>${cf}`;
  clearTimeout(BT);BT=setTimeout(()=>{b.className='';},3300);
}
function hideBanner(){clearTimeout(BT);const b=$('banner');if(b)b.className='';}
let NAMES=DEF.slice();
let G=null,GID=0;

/* ---------- 規則與 AI（純邏輯） ---------- */
function opp(p){return p==='B'?'W':'B';}
function lineStr(b,r,c,dr,dc,p,place){
  let s='';
  for(let k=-4;k<=4;k++){
    const rr=r+dr*k,cc=c+dc*k;let ch;
    if(rr<0||cc<0||rr>=N||cc>=N)ch='o';
    else if(k===0)ch=place?'x':'.';
    else{const v=b[rr*N+cc];ch=v===0?'.':(v===p?'x':'o');}
    s+=ch;
  }
  return s;
}
function pat(s){
  if(/xxxxx/.test(s))return [100000,'5'];
  if(/\.xxxx\./.test(s))return [10000,'4o'];
  if(/xxxx\.|\.xxxx|x\.xxx|xxx\.x|xx\.xx/.test(s))return [1000,'4'];
  if(/\.xxx\.|\.x\.xx\.|\.xx\.x\./.test(s))return [1000,'3o'];
  if(/xxx\.|\.xxx|x\.xx|xx\.x/.test(s))return [100,'3'];
  if(/\.xx\.|\.x\.x\./.test(s))return [100,'2o'];
  if(/xx|x\.x/.test(s))return [10,'2'];
  return [0,''];
}
function cellScore(b,r,c,p){
  let total=0,c4=0,o3=0,five=false;
  for(const [dr,dc] of DIRS){
    const a=pat(lineStr(b,r,c,dr,dc,p,true)),z=pat(lineStr(b,r,c,dr,dc,p,false));
    const gain=a[0]-z[0];
    if(gain>0){
      total+=gain;
      if(a[1]==='5')five=true;
      else if(a[1]==='4'||a[1]==='4o')c4++;
      else if(a[1]==='3o')o3++;
    }
  }
  if(c4>=2||(c4>=1&&o3>=1))total+=8000;
  else if(o3>=2)total+=2000;
  return {score:total,five};
}
function candidates(b){
  const out=[];let any=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(b[r*N+c]!==0)continue;
    let near=false;
    for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2;dc++){
      const rr=r+dr,cc=c+dc;
      if(rr>=0&&cc>=0&&rr<N&&cc<N&&b[rr*N+cc]!==0){near=true;break;}
    }
    if(near)out.push([r,c]);
  }
  for(let i=0;i<b.length;i++)if(b[i]!==0){any=true;break;}
  if(!any)out.push([7,7]);
  return out;
}
function aiMove(b,p,level){
  const cs=candidates(b);
  const q=opp(p);
  const list=[];
  for(const [r,c] of cs){
    const a=cellScore(b,r,c,p),d=cellScore(b,r,c,q);
    if(a.five)return [r,c];
    const dm=level==='easy'?0.45:0.95;
    const center=(14-Math.abs(r-7)-Math.abs(c-7))*2;
    list.push({r,c,s:a.score+d.score*dm+center+(d.five?90000:0)});
  }
  list.sort((x,y)=>y.s-x.s);
  let pick=list[0];
  if(level==='easy'){
    const k=Math.min(list.length,5);pick=list[Math.floor(Math.random()*k)];
  }else if(level==='normal'){
    const k=Math.min(list.length,3);
    pick=(list[0].s>=5000||Math.random()<.6)?list[0]:list[Math.floor(Math.random()*k)];
  }else{
    const best=list.filter(x=>x.s>=list[0].s*0.98);pick=best[Math.floor(Math.random()*best.length)];
  }
  return [pick.r,pick.c];
}
function checkWin(b,r,c){
  const p=b[r*N+c];if(!p)return null;
  for(const [dr,dc] of DIRS){
    const cells=[[r,c]];
    for(const s of [1,-1]){
      let rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&cc>=0&&rr<N&&cc<N&&b[rr*N+cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s;}
    }
    if(cells.length>=5)return cells;
  }
  return null;
}

/* ---------- 遊戲流程 ---------- */
function newGame(){
  GID++;hideBanner();if(G&&G.level==='learn')rollOps();
  const side=G?G.human:'B';
  G={board:new Array(N*N).fill(0),moves:[],turn:'B',human:side,over:false,win:null,level:G?G.level:'normal',hover:null,thinking:false,result:null,stats:G?G.stats:loadStats()};
  render();applyLevelUI();
  if(G.human==='W')aiTurn();
}
function loadStats(){try{return JSON.parse(localStorage.getItem('gomoku_stats'))||{w:0,l:0,d:0};}catch(e){return {w:0,l:0,d:0};}}
function saveStats(){try{localStorage.setItem('gomoku_stats',JSON.stringify(G.stats));}catch(e){}}
function place(r,c){
  const p=G.turn;G.board[r*N+c]=p;G.moves.push({r,c,p});
  const w=checkWin(G.board,r,c);
  if(w){G.over=true;G.win=w;G.result=p===G.human?'win':'lose';
    if(p===G.human)G.stats.w++;else G.stats.l++;saveStats();}
  else if(G.moves.length>=N*N){G.over=true;G.result='draw';G.stats.d++;saveStats();}
  else G.turn=opp(p);
}
function humanPlay(r,c){
  if(G.over||G.thinking||G.turn!==G.human||G.board[r*N+c]!==0)return;
  place(r,c);render();
  if(!G.over)aiTurn();
}
function aiTurn(){
  G.thinking=true;render();
  const id=GID;
  setTimeout(()=>{
    if(id!==GID)return;
    const [r,c]=aiMove(G.board,G.turn,G.level==='learn'?'normal':G.level);
    place(r,c);G.thinking=false;render();
  },380);
}
function undo(){
  if(G.thinking||!G.moves.some(m=>m.p===G.human))return;
  if(G.over&&G.result){
    if(G.result==='win')G.stats.w--;else if(G.result==='lose')G.stats.l--;else G.stats.d--;
    saveStats();
  }
  while(G.moves.length){
    const m=G.moves.pop();G.board[m.r*N+m.c]=0;
    if(m.p===G.human)break;
  }
  G.over=false;G.win=null;G.result=null;G.turn=G.human;G.bannerShown=false;hideBanner();
  render();
}

/* ---------- 畫面 ---------- */
let cv,ctx;
function $(id){return document.getElementById(id);}
function render(){
  const g=G;
  $('n0').textContent=NAMES[0];$('n1').textContent=NAMES[1];
  const hb=g.human==='B';
  $('d0').className='dot '+(hb?'b':'w');$('d1').className='dot '+(hb?'w':'b');
  $('r0').textContent=hb?'黑子・先手':'白子・後手';$('r1').textContent=hb?'白子・後手':'黑子・先手';
  const humanTurn=!g.over&&g.turn===g.human&&!g.thinking;
  $('p0').className='pl'+(!g.over&&g.turn===g.human?' turn':'');
  $('p1').className='pl'+(!g.over&&g.turn!==g.human?' turn':'');
  let st;
  if(g.over){st=g.result==='win'?`🎉 ${NAMES[0]}獲勝！`:g.result==='lose'?`${NAMES[1]}獲勝，再接再厲！`:'棋盤已滿，和局。';}
  else if(g.thinking)st=`${NAMES[1]}思考中…`;
  else st=`輪到${NAMES[0]}（${hb?'黑':'白'}子）`;
  $('status').textContent=st;
  $('stat').textContent=`累計戰績：${g.stats.w} 勝　${g.stats.l} 敗　${g.stats.d} 和　｜　目前第 ${g.moves.length} 手`;
  $('undoBtn').disabled=g.thinking||!g.moves.some(m=>m.p===g.human);
  $('side').value=g.human;$('level').value=g.level;
  draw();
  if(g.over&&!g.bannerShown){g.bannerShown=true;showBanner();}
}
function draw(){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1,S=cv.clientWidth;
  if(!S)return;
  if(cv.width!==Math.round(S*dpr)){cv.width=Math.round(S*dpr);cv.height=Math.round(S*dpr);}
  const g=ctx;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,S,S);
  const m=S/(N+1);
  const grd=g.createLinearGradient(0,0,S,S);grd.addColorStop(0,'#e6bf74');grd.addColorStop(1,'#d3a653');
  g.fillStyle=grd;g.fillRect(0,0,S,S);
  g.strokeStyle='#5a3b12';g.lineWidth=Math.max(1,m*.04);
  g.beginPath();
  for(let i=0;i<N;i++){const p=m*(i+1);g.moveTo(m,p);g.lineTo(S-m,p);g.moveTo(p,m);g.lineTo(p,S-m);}
  g.stroke();
  g.fillStyle='#5a3b12';
  for(const [r,c] of [[3,3],[3,11],[11,3],[11,11],[7,7]]){g.beginPath();g.arc(m*(c+1),m*(r+1),m*.09,0,7);g.fill();}
  const R=m*.44;
  const stone=(r,c,p,alpha)=>{
    const x=m*(c+1),y=m*(r+1);
    g.globalAlpha=alpha;
    g.shadowColor='#0006';g.shadowBlur=alpha===1?m*.14:0;g.shadowOffsetY=alpha===1?m*.05:0;
    const rg=g.createRadialGradient(x-R*.35,y-R*.35,R*.1,x,y,R);
    if(p==='B'){rg.addColorStop(0,'#777');rg.addColorStop(1,'#000');}
    else{rg.addColorStop(0,'#fff');rg.addColorStop(1,'#cfcfcf');}
    g.fillStyle=rg;g.beginPath();g.arc(x,y,R,0,7);g.fill();
    g.shadowColor='transparent';
    if(p==='W'){g.strokeStyle='#9a9a9a';g.lineWidth=1;g.stroke();}
    g.globalAlpha=1;
  };
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=G.board[r*N+c];if(v)stone(r,c,v,1);}
  if(G.hover&&!G.over&&G.turn===G.human&&!G.thinking&&G.board[G.hover[0]*N+G.hover[1]]===0)stone(G.hover[0],G.hover[1],G.human,.45);
  const last=G.moves[G.moves.length-1];
  if(last){g.fillStyle='#e03030';g.beginPath();g.arc(m*(last.c+1),m*(last.r+1),m*.11,0,7);g.fill();}
  if(G.win){
    g.strokeStyle='#f2c230';g.lineWidth=Math.max(2,m*.1);
    for(const [r,c] of G.win){g.beginPath();g.arc(m*(c+1),m*(r+1),R+m*.03,0,7);g.stroke();}
  }
}
function cellAt(e){
  const rc=cv.getBoundingClientRect(),S=rc.width,m=S/(N+1);
  const x=(e.clientX-rc.left)/m-1,y=(e.clientY-rc.top)/m-1;
  const c=Math.round(x),r=Math.round(y);
  if(r<0||c<0||r>=N||c>=N)return null;
  if(Math.hypot(x-c,y-r)>0.55)return null;
  return [r,c];
}
let THEME='auto';
function applyTheme(){document.documentElement.setAttribute('data-theme',THEME);$('themeBtn').textContent='外觀：'+({auto:'自動',light:'淺色',dark:'深色'}[THEME]);}

function init(){
  try{const s=JSON.parse(localStorage.getItem('gomoku_names')||'null');if(Array.isArray(s)&&s.length===2)NAMES=s.map((x,i)=>String(x||'').trim().slice(0,6)||DEF[i]);}catch(e){}
  try{THEME=localStorage.getItem('gomoku_theme')||'auto';}catch(e){}
  cv=$('cv');ctx=cv.getContext('2d');
  cv.addEventListener('pointermove',e=>{if(!G)return;const c=cellAt(e);const h=G.hover;G.hover=c;if(!h!==!c||(h&&c&&(h[0]!==c[0]||h[1]!==c[1])))draw();});
  cv.addEventListener('pointerleave',()=>{G.hover=null;draw();});
  cv.addEventListener('pointerdown',e=>{const c=cellAt(e);if(c)humanPlay(c[0],c[1]);});
  window.addEventListener('resize',()=>{layoutPanel();draw();});window.addEventListener('load',layoutPanel);
  $('undoBtn').onclick=undo;
  $('newBtn').onclick=()=>{if(!G.moves.length||G.over||confirm('確定要重新開始這一局嗎？'))newGame();};
  $('side').onchange=e=>{G.human=e.target.value;newGame();};
  $('level').onchange=e=>{G.level=e.target.value;if(G.level==='learn')rollOps();applyLevelUI();};
  $('themeBtn').onclick=()=>{THEME={auto:'light',light:'dark',dark:'auto'}[THEME];try{localStorage.setItem('gomoku_theme',THEME);}catch(e){}applyTheme();};
  $('nameBtn').onclick=()=>{
    const pos=['你的名稱','對手（電腦）的名稱'];
    $('mbox').innerHTML='<h2 style="margin:0 0 10px">更改玩家名稱</h2>'+NAMES.map((n,i)=>`<p style="margin:6px 0"><label>${pos[i]}<br><input id="nm${i}" maxlength="6" value="${n.replace(/"/g,'&quot;')}"></label></p>`).join('')+'<div class="row" style="margin-top:10px"><button id="nmSave">儲存</button><button class="alt" id="nmCancel">取消</button></div><p style="font-size:12px;opacity:.7">最多 6 個字，留空則還原預設名稱。</p>';
    $('modal').className='on';
    $('nmCancel').onclick=()=>{$('modal').className='';};
    $('nmSave').onclick=()=>{
      NAMES=[0,1].map(i=>$('nm'+i).value.trim().slice(0,6)||DEF[i]);
      try{localStorage.setItem('gomoku_names',JSON.stringify(NAMES));}catch(e){}
      $('modal').className='';render();
    };
  };
  applyTheme();newGame();layoutPanel();
}
if(typeof window!=='undefined'&&!window.__TEST__)init();
</script>
