<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教練版｜共通進階版</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#2d3561;--navy2:#454f87;--sage:#6f8f7a;--sage-l:#e4ece6;--terra:#b5654f;--terra-l:#f6e6e1;--bg:#f4f3ef;--card:#fff;--ink:#222634;--mute:#6b7080;--line:#dcdbd4;--gold:#b8892d}
*{box-sizing:border-box}
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體",sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.wide{max-width:980px}
h1,h2,h3{line-height:1.35;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--sage);font-weight:700}
.mute{color:var(--mute)}
.small{font-size:13px}
.btn{appearance:none;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:13px 26px;border-radius:10px;cursor:pointer;min-height:48px}
.btn:hover{background:var(--navy2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:#eef0f8}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
/* home */
.home{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;min-height:calc(100vh - 40px)}
.home h1{font-size:clamp(30px,4.6vw,48px);color:var(--navy);margin:10px 0 14px}
.home .sub{font-size:18px;color:var(--mute);margin-bottom:22px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}
.fact{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.fact b{display:block;font-size:22px;color:var(--navy)}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}
.qrbox canvas,.qrbox svg,.qrbox img{width:100%;max-width:340px;height:auto;display:block;margin:0 auto 12px}
.urlline{word-break:break-all;font-size:13px;color:var(--mute)}
.warn{background:var(--terra-l);color:#7c3a29;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:10px}
input[type=text],input[type=email],input[type=tel],input[type=url]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:#222634;-webkit-text-fill-color:#222634;caret-color:#222634;min-height:48px}
input::placeholder{color:#9a9eab;-webkit-text-fill-color:#9a9eab}
input:-webkit-autofill{-webkit-text-fill-color:#222634;box-shadow:0 0 0 100px #fff inset}
input:focus{outline:none;border-color:var(--navy)}
label.f{display:block;font-weight:700;margin:14px 0 6px}
label.f i{color:var(--terra);font-style:normal}
.err{color:var(--terra);font-size:13px;min-height:18px}
.consent{background:#f8f8f4;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--mute);margin:16px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}
.chk input{width:22px;height:22px;margin-top:3px;flex:none}
/* quiz */
.prog{height:8px;background:#e5e4de;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog>div{height:100%;background:var(--sage);transition:width .25s}
.qtag{display:inline-block;background:var(--sage-l);color:#3d5b49;font-size:13px;font-weight:700;border-radius:99px;padding:2px 12px}
.qtext{font-size:19px;font-weight:700;margin:12px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.opt:hover{border-color:var(--navy2)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#eceae4;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--navy);background:#eef0f8}
.opt.sel .l{background:var(--navy);color:#fff}
.opt.good{border-color:#2f6b4c;background:#e9f3ed}.opt.good .l{background:#2f6b4c;color:#fff}.opt.bad{border-color:var(--terra);background:var(--terra-l)}.opt.bad .l{background:var(--terra);color:#fff}.opt.dim{opacity:.6;cursor:default}.opt:disabled{cursor:default}.tg{font-size:12px;color:#2f6b4c;border:1px solid #2f6b4c;border-radius:99px;padding:0 8px;margin-left:6px;white-space:nowrap}.fb{border-radius:10px;padding:12px 14px;margin-top:6px;font-size:15px}.fbok{background:#e9f3ed;color:#1f4a31}.fbno{background:var(--terra-l);color:#6e301f}
.vc{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}.vc.on{border-color:var(--navy);background:#eef0f8;box-shadow:0 0 0 2px rgba(45,53,97,.12)}.vc .vt{font-weight:700;display:inline}.vc .vl{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;background:var(--sage-l);color:#33563f;border-radius:99px;padding:0 10px}.vc .vd{display:block;font-size:13px;color:var(--mute);margin-top:2px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{font:inherit;color:inherit;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}.seg button.on{border-color:var(--navy);background:#eef0f8}.seg b{display:block}.seg span{font-size:12px;color:var(--mute)}.kopt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;margin-bottom:6px;background:#faf9f6;font-size:14px}.kopt b{flex:none;width:36px}.kopt i{flex:none;font-style:normal;font-size:12px;color:#2f6b4c;border:1px solid #2f6b4c;border-radius:99px;padding:0 8px}.kopt.k4{background:#e9f3ed}
.qrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.qc{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;break-inside:avoid}.qc svg{width:100%;max-width:200px;height:auto;display:block;margin:0 auto 6px}@media(max-width:720px){.qrgrid{grid-template-columns:1fr 1fr}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* report */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.big{font-size:76px;font-weight:800;color:var(--navy);line-height:1}
.big small{font-size:22px;color:var(--mute);font-weight:600}
.badge{display:inline-block;color:#fff;font-weight:700;border-radius:8px;padding:3px 14px;font-size:15px}
.scale{position:relative;height:16px;border-radius:99px;margin:34px 0 28px;background:linear-gradient(90deg,#c98d7e 0 35%,#d8b86a 35% 60%,#8fb09a 60% 80%,#4a7a60 80% 100%)}
.scale .pin{position:absolute;top:-9px;width:4px;height:34px;background:var(--navy);border-radius:2px;transform:translateX(-2px)}
.scale .pin::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--navy)}
.scale .tk{position:absolute;top:22px;font-size:11px;color:var(--mute);transform:translateX(-50%)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);background:#faf9f6}
td.n{text-align:center;white-space:nowrap}
.bar{height:10px;background:#e8e7e0;border-radius:99px;overflow:hidden;min-width:70px}
.bar>div{height:100%}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.t0{background:var(--terra-l);color:#8a3f2a}.t1{background:#f5ecd2;color:#7d5b12}.t2{background:var(--sage-l);color:#33563f}.t3{background:#cfe3d6;color:#1f4a31}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pill3 .p{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.pill3 .p b{font-size:28px;color:var(--navy)}
.act{border-left:4px solid var(--terra);padding:8px 14px;margin:10px 0;background:#fbf7f5;border-radius:0 8px 8px 0}
.str{border-left:4px solid var(--sage);padding:8px 14px;margin:10px 0;background:#f3f7f4;border-radius:0 8px 8px 0}
@media(max-width:720px){.home{grid-template-columns:1fr;min-height:0;gap:20px}.hero,.two{grid-template-columns:1fr}.pill3{grid-template-columns:1fr}.big{font-size:60px}.qrbox{order:-1}}
@media print{body{background:#fff}.noprint{display:none!important}.card{break-inside:avoid;border-color:#ccc}.wrap{padding:0}}
</style>
</head>

<script>

  ENDPOINT: "https://script.google.com/macros/s/AKfycbwpUVJzszuWDNSCg2vpEJMs2C47B8cDZ-e48b8rH4EjL6-Pduxn2TZd3E5eaQVQWAMYnA/exec",
  VERSION: "v1.0",
  MIN_SECONDS: 180,        // 低於此秒數視為作答過快

  FEEDBACK: false          // true＝練習版：每題作答後立即顯示對錯、標準答案與解析

var SV={id:"sde",name:"銷售經濟學思維成熟度",sub:"B2B 銷售的底層邏輯　培訓配套評量",dimTitle:"十二道經濟學防線",pilTitle:"三大戰場",pilSub:"對應培訓總結：資源控管（護城河）、客戶心理（攻心計）、大局博弈（控盤術）。",N:24};
/* ============ 構面與三大戰場（對應培訓資料：12 道經濟學防線） ============ */
var DIMS = {
 E1:{n:"機會成本",e:"你選了A，真正的成本是被迫放棄的B；時間要押在最有回報的地方。",g:"死守一個卡關的超大客戶，卻讓一群能快速成交的中小客戶流失。",a:"替每個大案設定停損點與回應期限，把約八成精力轉向決策鏈短、預算明確的客戶。"},
 E2:{n:"沉沒成本",e:"已經花掉的時間與資源回不來，不該綁架今天的決策。",g:"因為「已經投入這麼多」而繼續提供免費PoC、免費顧問，遲遲不肯結案。",a:"對每個案子只看「從現在起」的投入與回報；沒有明確決策條件就果斷改為 Closed Lost，隔天開發新名單。"},
 E3:{n:"比較優勢",e:"重點不是你能不能做，而是你做這件事划不划算；讓效益較高的一方做效益最高的事。",g:"什麼都自己來，連售後與技術排除也親力親為。",a:"盤點時間時薪，把售後、行政與技術支援交給專業團隊，自己只專注在破冰、促單與談判。"},
 E4:{n:"邊際成本與收益",e:"努力不是越多越好，要精算「多拼那一點」到底划不划算。",g:"為利潤薄的小案子熬夜客製、隨時待命，投入遠超過獲利。",a:"算出每個案子的「精神賠償金」，對低利潤客戶只提供標準方案，並在超出範圍時付費或婉拒。"},
 E5:{n:"邊際效益遞減",e:"同一件東西擁有越多，多得到一單位的快感越少；讓利要有底線。",g:"用堆疊贈品、加碼服務討好客戶，反而讓客戶覺得「本來就該如此」。",a:"找出客戶的「痛點（熱愛）」而非「癢點（喜歡）」，把資源集中在解決他最致命的問題。"},
 E6:{n:"選擇悖論",e:"選項越多，人越難做決定，最後往往變成「沒有選」或滿意度極低。",g:"把十種自由搭配的模組丟給客戶，逼他自己研究。",a:"報價單永遠只給三個選項（Good／Better／Best），並標示推薦，讓多數客戶直接選中間檔。"},
 E7:{n:"路徑依賴",e:"一旦依賴某件事，就算明知不理性，人們也會因習慣而繼續走下去。",g:"以為降價10%就能讓客戶換掉舊系統，忽略員工的習慣與轉換麻煩。",a:"提供「資料無痛移轉計畫書」與「舊員工3小時上手教育訓練表」，證明轉換成本極低。"},
 E8:{n:"稟賦效應",e:"人一旦擁有某樣東西，就會高估它的價值，並排斥重新評估。",g:"只做簡報、不讓客戶親手操作，客戶始終沒有「這是我的」感覺。",a:"提供14天沙盒環境，協助客戶匯入真實業務數據，讓系統變成他們的心血，續約時自然引發損失厭惡。"},
 E9:{n:"價值與價格",e:"有價值的東西不一定有高價格；兩者的落差來自資訊不對稱與市場預期。",g:"在客戶估值最低的時候談價格、要轉介紹，或讓客戶看不見價值。",a:"在客戶成功上線、最滿意的那一刻請求轉介紹，並把效益量化成金額，縮小價值與價格的落差。"},
 E10:{n:"價格信號",e:"價格不只是數字，也是稀缺性與品質的訊號；太便宜在B2B等於「怕踩雷」。",g:"為了搶單主動砍價到見骨，反而讓採購覺得品質有問題。",a:"以高於市場約20%的定價搭配SLA保證（如24小時修復），讓價格成為「找你最安心」的訊號。"},
 E11:{n:"囚徒困境",e:"雙方因互相猜忌而選擇背叛，導致雙輸；唯有累積信任，才能走向集體最優。",g:"與採購互砍底線，陷入「不降價就不簽」的十年徒刑。",a:"用戰略性信任破局：小幅讓步換取更長的合約與更穩定的訂單，把單次博弈變成長期共贏。"},
 E12:{n:"交易成本",e:"購買付出的成本不只是金錢，還包含搜尋、比較、溝通、審核與導入麻煩等「摩擦力」。",g:"合約長達50頁、法務審查三個月，客戶想買卻一直買不下去。",a:"把冗長合約精簡成3頁標準化購單，把繁雜流程變成一鍵註冊，降低客戶內部的交易成本。"}
};
var PILLARS = {
 A:{n:"資源控管（護城河）",s:"算清自己的時間與精力，把資源押在最有回報的地方",d:["E1","E2","E3","E4"]},
 B:{n:"客戶心理（攻心計）",s:"運用行為經濟學，讓客戶更輕鬆、更安心地做出決定",d:["E5","E6","E7","E8"]},
 C:{n:"大局博弈（控盤術）",s:"在價格、信任與交易流程上掌握主導權",d:["E9","E10","E11","E12"]}
};
var LEVELS = [
 {k:"L1",n:"勞力拼搏型",min:0,raw:"",c:"#b5654f",d:"主要靠時間與體力衝刺：什麼都自己做、什麼客戶都不放、價格被牽著走。成交多來自運氣與勤奮，資源容易被低效益的事消耗。",nx:"先學會「算帳」：盤點時間用途、設定每個案子的停損點，並把售後與行政工作交給專業分工。"},
 {k:"L2",n:"經驗直覺型",min:35,raw:"",c:"#c79a3a",d:"有業務直覺與一定的經驗，部分情境已懂得取捨，但缺乏系統化的經濟學框架，遇到壓力時仍會回到讓利、陪跑與客製的老習慣。",nx:"挑出得分最低的兩三道防線，用真實案件做一次「機會成本與邊際效益」的盤點，並把做法寫成個人SOP。"},
 {k:"L3",n:"經濟算盤型",min:60,raw:"",c:"#5f8f72",d:"能在多數情境運用機會成本、邊際效益、價格信號等觀念做出理性取捨；仍有個別防線不穩定，或在高壓下被客戶牽動而讓步。",nx:"針對短板做情境演練，並把成功做法沉澱成報價、試用與合約的標準模板，讓團隊也能複製。"},
 {k:"L4",n:"戰略顧問型",min:80,raw:"",c:"#2f6b4c",d:"把經濟學思維內化為談判桌上的底氣：精算自己的資源、設計客戶的決策環境、掌握價格與信任的主導權，是B2B的戰略顧問。",nx:"建議擔任內部教練，將做法整理成團隊的報價與談判守則，並持續檢視在大型案件中是否一致執行。"}
];
var BMETA={
 basic:{lab:"入門版",title:"共通入門版",ver:"E-BASIC-v1.0",lv:"入門",desc:"情境直白、重點明確，適合初次接觸經濟學思維的學員暖身與觀念建立。"},
 adv:{lab:"進階版",title:"共通進階版",ver:"E-ADV-v1.0",lv:"進階",desc:"選項長度拉平、誘答選項更貼近實務，能拉開學員差異並找出短板。"},

};

LEVELS.forEach(function(l,i){var lo=Math.ceil(SV.N+l.min*0.03*SV.N-1e-9),hi=i<3?Math.ceil(SV.N+LEVELS[i+1].min*0.03*SV.N-1e-9)-1:SV.N*4;l.raw=lo+"–"+hi;});
var TIERS = [{n:"待建立",c:"t0"},{n:"發展中",c:"t1"},{n:"熟練",c:"t2"},{n:"精熟",c:"t3"}];

var DIMS_BASEA={};Object.keys(DIMS).forEach(function(k){DIMS_BASEA[k]=DIMS[k].a;});
function convertBank(B){B.bank.forEach(function(q){q.o=q.o.map(function(x){return {id:x[0],s:x[1],t:x[2]};});});return B;}

/* ============ 工具 ============ */
var $app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rnd(n){var a=new Uint32Array(1);if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function uid(){var s="";for(var i=0;i<4;i++)s+=("0000"+rnd(65536).toString(16)).slice(-4);return "S"+Date.now().toString(36)+"-"+s;}
function ss(k,v){try{if(v===undefined)return JSON.parse(sessionStorage.getItem(k));if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function pad(n){return ("0"+n).slice(-2);}
function fmtDT(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}

/* 每次啟動重新排序：題序與選項序皆隨機；盡量避免同構面的題目相鄰 */
function buildOrder(){
  var best=null;
  for(var t=0;t<300;t++){
    var qs=shuffle(BANK.map(function(q,i){return i;})),bad=0;
    for(var i=1;i<qs.length;i++)if(BANK[qs[i]].d===BANK[qs[i-1]].d)bad++;
    if(!best||bad<best.bad)best={qs:qs,bad:bad};
    if(bad===0)break;
  }
  return best.qs.map(function(qi){return {qi:qi,opts:shuffle(BANK[qi].o.map(function(o,i){return i;}))};});
}

/* ============ 狀態與路由 ============ */
var S=ss("sdm_state")||null,CUR=null,COACH=false;
function save(){ss("sdm_state",S);}
function activate(k,coach){
  CUR=k;COACH=!!coach;var B=BANKS[k];BANK=B.bank;WHY=B.why||{};
  Object.keys(DIMS).forEach(function(d){DIMS[d].a=(B.dimsA&&B.dimsA[d])||DIMS_BASEA[d];});
  CONFIG.BANK_NAME=(k==="auto"?BMETA[k].title:"");CONFIG.VERSION=BMETA[k].ver;CONFIG.FEEDBACK=!!coach;
}
function resetIf(coach){if(S&&(S.bank!==BKEY||!!S.coach!==coach)){S=null;ss("sdm_state",null);}}
function route(){
  if(MODE==="console")return viewConsole();
  if(MODE==="coach"){
    if(!BANKS[BKEY])return viewGate();
    activate(BKEY,true);resetIf(true);
    var h=location.hash;
    if(h==="#key")return viewKey(BKEY);
    if(h==="#practice"){
      if(!S){S={id:uid(),bank:BKEY,coach:true,info:{company:"（教練版）",title:"教練",name:"練習者",email:"",phone:""},bot:false,order:buildOrder(),ans:{},cur:0,started:true,t0:Date.now(),done:false};save();}
      return S.done?viewReport():viewQuiz();
    }
    return viewCoachMenu();
  }
  activate(BKEY,false);resetIf(false);
  if(S&&S.done)return viewReport();
  if(S&&S.payload)return viewSubmit();
  if(S&&S.started)return viewQuiz();
  viewInfo();
}
window.addEventListener("hashchange",route);

/* ============ 教練專區：解密、選單、答案總表 ============ */
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function decryptBank(pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},k,b64(ENC.ct));})
   .then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});
}
function viewGate(){
  $app.innerHTML='<div class="wrap"><div class="card"><div class="eyebrow">教練專區｜'+esc(BMETA[BKEY].lab)+'（'+esc(BMETA[BKEY].title)+'）</div><h2 style="margin:6px 0 10px">請輸入教練通行碼</h2><p class="small mute" style="margin:0 0 8px">標準答案與解析已加密，輸入正確通行碼後才會在您的裝置上解開。</p><input type="text" id="pin" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="err" id="pe"></div><button class="btn" id="pgo" style="margin-top:8px">進入</button></div></div>';
  function go(){
    var v=document.getElementById("pin").value.replace(/[\s-]/g,"").toUpperCase();if(!v)return;
    document.getElementById("pgo").disabled=true;document.getElementById("pe").textContent="解密中…";
    decryptBank(v).then(function(d){BANKS[BKEY]=convertBank(d);route();}).catch(function(){document.getElementById("pgo").disabled=false;document.getElementById("pe").textContent="通行碼錯誤，請再試一次。";});
  }
  document.getElementById("pgo").onclick=go;document.getElementById("pin").onkeydown=function(e){if(e.key==="Enter")go();};
  document.getElementById("pin").focus();
}
function viewCoachMenu(){
  var m=BMETA[BKEY];
  $app.innerHTML='<div class="wrap"><div class="card"><div class="eyebrow">教練版｜'+esc(m.lab)+'（'+esc(m.title)+'）　題庫 '+m.ver+'</div><h2 style="margin:6px 0 10px">'+SV.name+'問卷</h2><p class="mute" style="margin:0 0 14px">教練版含標準答案：練習時每題作答後立即顯示對錯與解析，不填基本資料、也不寫入試算表。</p><div class="row"><button class="btn" id="pr">開始練習（即時對錯與解析）</button><button class="btn ghost" id="ky">查看答案總表</button></div></div></div>';
  document.getElementById("pr").onclick=function(){ss("sdm_state",null);S=null;location.hash="practice";route();};
  document.getElementById("ky").onclick=function(){location.hash="key";};
}
function viewKey(k){
  var B=BANKS[k],m=BMETA[k];
  var h='<div class="wrap wide"><div class="row noprint" style="justify-content:space-between;margin-bottom:10px"><button class="btn ghost" id="back">← 回到教練選單</button><button class="btn" id="prt">列印／另存PDF</button></div>'+
   '<div class="card"><div class="eyebrow">教練專用｜答案總表</div><h2 style="margin:6px 0 6px">'+esc(m.lab)+'（'+esc(m.title)+'）　題庫 '+m.ver+'</h2><p class="small mute" style="margin:0">題號為題庫固定編號（學員作答時題序與選項序會隨機排列）。每題以 4 分為標準答案；3 分表示方向正確但不是最佳做法。</p></div>';
  B.bank.forEach(function(q){
    var os=q.o.slice().sort(function(a,b){return b.s-a.s;});
    h+='<div class="card" style="break-inside:avoid"><span class="qtag">第 '+q.id+' 題｜'+esc(DIMS[q.d].n)+'</span><div class="qtext" style="font-size:17px">'+esc(q.q)+'</div>';
    os.forEach(function(o){h+='<div class="kopt'+(o.s===4?' k4':'')+'"><b>'+o.s+' 分</b>'+(o.s===4?'<i>標準答案</i>':'')+'<span>'+esc(o.t)+'</span></div>';});
    h+='<div class="fb fbok" style="margin-top:8px"><b>解析：</b>'+esc((B.why||{})[q.id]||"")+'</div></div>';
  });
  h+='</div>';$app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("back").onclick=function(){location.hash="";route();};
  document.getElementById("prt").onclick=function(){try{window.print();}catch(e){}};
}

   '<div class="urlline">'+esc(url)+'</div>'+
   (local?'<div class="warn">目前是以本機檔案開啟，手機無法連到此網址。請改用已部署的網址開啟控制台。</div>':'')+

/* ============ 受測者資料 ============ */

  var i=(S&&S.info)||{};
  $app.innerHTML='<div class="wrap"><div class="card"><div class="eyebrow">STEP 1／2　基本資料</div><h2 style="margin:6px 0 4px">'+SV.name+'問卷</h2>'+
  '<p class="mute" style="margin:0 0 6px">請先填寫基本資料，完成後即可開始作答。所有欄位皆為必填。</p>'+
  '<form id="f" novalidate>'+
  fld("company","企業名稱","text",i.company,"organization")+fld("title","職稱","text",i.title,"organization-title")+fld("name","姓名","text",i.name,"name")+
  fld("email","電子郵件","email",i.email,"email")+fld("phone","聯絡電話","tel",i.phone,"tel")+
  '<div style="position:absolute;left:-9999px" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>'+
  '<div class="consent"><b>個人資料蒐集告知：</b>本問卷蒐集您的姓名、企業名稱、職稱、電子郵件與電話，僅用於本次培訓成效評估、產出成熟度報告及後續培訓聯繫，不會提供予無關之第三方。您可隨時向主辦單位請求查詢、更正或刪除。</div>'+
  '<label class="chk"><input type="checkbox" id="ok"><span>我已閱讀並同意上述個人資料蒐集與使用方式。</span></label><div class="err" id="e_ok"></div>'+
  '<button class="btn" type="submit" style="width:100%">開始作答</button></form></div>'+
  '<p class="small mute" style="text-align:center">本問卷題序與選項序每次皆會重新排列。請依你<b>平常實際會採取的做法</b>作答，而非「標準答案」。</p></div>';
  document.getElementById("f").onsubmit=function(ev){ev.preventDefault();submitInfo();};
}
function fld(id,l,t,v,ac){return '<label class="f" for="'+id+'">'+l+' <i>＊</i></label><input type="'+t+'" id="'+id+'" autocomplete="'+ac+'" value="'+esc(v||"")+'" maxlength="100"><div class="err" id="e_'+id+'"></div>';}
function submitInfo(){
  var v={},ok=true,m={company:"請輸入企業名稱",title:"請輸入職稱",name:"請輸入姓名",email:"請輸入有效的電子郵件",phone:"請輸入有效的聯絡電話"};
  ["company","title","name","email","phone"].forEach(function(k){
    v[k]=document.getElementById(k).value.trim();var good=!!v[k];
    if(k==="email")good=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v[k]);
    if(k==="phone")good=/^[0-9+\-()#\s]{8,20}$/.test(v[k])&&v[k].replace(/\D/g,"").length>=8;
    document.getElementById("e_"+k).textContent=good?"":m[k];if(!good)ok=false;
  });
  var c=document.getElementById("ok").checked;document.getElementById("e_ok").textContent=c?"":"請勾選同意後再繼續";if(!c)ok=false;
  if(!ok)return;
  var bot=document.getElementById("website").value;
  S={id:uid(),bank:BKEY,coach:false,info:v,bot:!!bot,order:buildOrder(),ans:{},cur:0,started:true,t0:Date.now(),done:false};
  save();viewQuiz();window.scrollTo(0,0);
}

/* ============ 作答 ============ */
function viewQuiz(){
  var n=S.order.length,c=S.cur,it=S.order[c],q=BANK[it.qi],sel=S.ans[q.id];
  var L="ABCDE";
  var h='<div class="wrap">'+(CONFIG.FEEDBACK?'<div class="warn" style="margin:0 0 10px">教練版：每題作答後會立即顯示對錯、標準答案與解析，作答後不可更改，成績不寫入試算表。</div>':'')+'<div class="row" style="justify-content:space-between"><span class="small mute">第 '+(c+1)+' ／ '+n+' 題</span><span class="small mute">已作答 '+Object.keys(S.ans).length+' 題</span></div>'+
   '<div class="prog"><div style="width:'+(Object.keys(S.ans).length/n*100)+'%"></div></div>'+
   '<div class="card" style="margin-top:14px"><span class="qtag">情境 '+(c+1)+'｜'+esc(DIMS[q.d].n)+'</span><div class="qtext">'+esc(q.q)+'</div><div id="opts">';
  var fb=CONFIG.FEEDBACK&&sel,chosen=null;
  q.o.forEach(function(x){if(x.id===sel)chosen=x;});
  it.opts.forEach(function(oi,pos){var o=q.o[oi],cl="";
    if(fb){cl=o.s===4?" good":(sel===o.id?" bad":" dim");}else if(sel===o.id)cl=" sel";
    h+='<button class="opt'+cl+'" data-id="'+o.id+'" data-pos="'+pos+'"'+(fb?' disabled':'')+'><span class="l">'+(fb&&o.s===4?"✓":(fb&&sel===o.id?"✗":L[pos]))+'</span><span>'+esc(o.t)+(fb&&o.s===4?' <b class="tg">標準答案</b>':'')+'</span></button>';});
  h+='</div>';
  if(fb){var ok=chosen.s===4;h+='<div class="fb '+(ok?"fbok":"fbno")+'"><b>'+(ok?"✓ 答對了":"✗ 答錯了")+'</b>'+(ok?'':'（你的選擇為 '+chosen.s+' 分'+(chosen.s===3?'：方向正確，但不是最佳做法':'')+'）')+'<br>'+esc(WHY[q.id])+'</div>';}
  h+='</div><div class="nav"><button class="btn ghost" id="prev"'+(c===0?" disabled":"")+'>上一題</button>';
  h+=(c===n-1)?'<button class="btn" id="fin"'+(Object.keys(S.ans).length<n?" disabled":"")+'>送出並查看報告</button>':'<button class="btn" id="next"'+(sel?"":" disabled")+'>下一題</button>';
  h+='</div>'+(c===n-1&&Object.keys(S.ans).length<n?'<p class="err" style="text-align:center;margin-top:10px">尚有題目未作答，請用「上一題」補答。</p>':'')+'</div>';
  $app.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){
    if(CONFIG.FEEDBACK&&S.ans[q.id])return;S.ans[q.id]=b.dataset.id;S.pos=S.pos||{};S.pos[q.id]=+b.dataset.pos;save();
    if(S.cur<n-1){viewQuiz();}else{viewQuiz();}
  };});
  var p=document.getElementById("prev");if(p)p.onclick=function(){S.cur--;save();viewQuiz();window.scrollTo(0,0);};
  var nx=document.getElementById("next");if(nx)nx.onclick=function(){S.cur++;save();viewQuiz();window.scrollTo(0,0);};
  var fn=document.getElementById("fin");if(fn)fn.onclick=finish;
}

/* ============ 計分 ============ */
function score(){
  var qs={},dm={},total=0;
  BANK.forEach(function(q){var o=q.o.filter(function(x){return x.id===S.ans[q.id];})[0];var s=o?o.s:1;qs[q.id]=s;total+=s;dm[q.d]=(dm[q.d]||0)+s;});
  var idx=Math.round((total-SV.N)/(3*SV.N)*1000)/10;
  var lv=0;LEVELS.forEach(function(l,i){if(idx>=l.min)lv=i;});
  var dIdx={};Object.keys(DIMS).forEach(function(k){dIdx[k]=Math.round((dm[k]-2)/6*1000)/10;});
  var pIdx={};Object.keys(PILLARS).forEach(function(p){var sum=0,cnt=0;PILLARS[p].d.forEach(function(k){sum+=dm[k];cnt+=2;});pIdx[p]=Math.round((sum-cnt)/(cnt*3)*1000)/10;});
  return {qs:qs,dm:dm,dIdx:dIdx,pIdx:pIdx,total:total,idx:idx,lv:lv};
}
function tierOf(i){return i<25?0:i<58?1:i<92?2:3;}

function finish(){
  var secs=Math.round((Date.now()-S.t0)/1000),flags=[];
  if(COACH){var sc0=score();S.result={sc:sc0,secs:secs,flags:[],at:fmtDT(new Date()),status:"skip"};S.done=true;save();return viewReport();}
  if(secs<CONFIG.MIN_SECONDS)flags.push("作答過快（"+secs+"秒）");
  var cnt={};Object.keys(S.pos||{}).forEach(function(k){cnt[S.pos[k]]=(cnt[S.pos[k]]||0)+1;});
  var mx=0;Object.keys(cnt).forEach(function(k){mx=Math.max(mx,cnt[k]);});
  if(mx>=Math.ceil(SV.N*0.75))flags.push("選項位置高度集中（"+mx+"/"+SV.N+"）");
  if(S.bot)flags.push("疑似機器填寫");
  S.fin={secs:secs,flags:flags,at:fmtDT(new Date())};
  S.payload={id:S.id,ts:S.fin.at,survey:SV.id,bank:BKEY,ver:CONFIG.VERSION,company:S.info.company,title:S.info.title,name:S.info.name,email:S.info.email,phone:S.info.phone,
    seconds:secs,quality:flags.join("；")||"正常",answers:S.ans,order:S.order.map(function(x){return BANK[x.qi].id;}).join(",")};
  save();viewSubmit();
}
function viewSubmit(){
  $app.innerHTML='<div class="wrap"><div class="card" style="text-align:center"><h3>正在計算並記錄您的結果…</h3><p class="mute">請稍候，請勿關閉本頁。</p></div></div>';
  send();
}
function showErr(msg){
  $app.innerHTML='<div class="wrap"><div class="card"><h3>送出未完成</h3><p>'+esc(msg)+'</p><button class="btn" id="retry">重新送出</button><p class="small mute" style="margin-top:10px">您的作答已暫存在本頁，重新送出不會造成重複記錄。</p></div></div>';
  document.getElementById("retry").onclick=viewSubmit;
}
function send(){
  if(!CONFIG.ENDPOINT){return showErr("系統尚未設定資料連線，暫時無法產生報告，請通知講師。");}
  fetch(CONFIG.ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(S.payload)})
   .then(function(r){return r.json();})
   .then(function(j){
     if(j&&j.ok&&j.result){S.result={sc:j.result,secs:S.fin.secs,flags:S.fin.flags,at:S.fin.at,status:"ok"};S.done=true;save();viewReport();}
     else throw new Error((j&&j.error)||"bad");})
   .catch(function(){showErr("資料傳送失敗，請檢查網路後重新送出。");});
}

/* ============ 報告 ============ */
function radar(sc){
  var keys=Object.keys(DIMS),N=keys.length,cx=210,cy=190,R=120,pts=[],grid="",lab="";
  for(var g=1;g<=4;g++){var pp=[];for(var i=0;i<N;i++){var a=-Math.PI/2+2*Math.PI*i/N;pp.push((cx+R*g/4*Math.cos(a)).toFixed(1)+","+(cy+R*g/4*Math.sin(a)).toFixed(1));}grid+='<polygon points="'+pp.join(" ")+'" fill="none" stroke="#dcdbd4"/>';}
  keys.forEach(function(k,i){var a=-Math.PI/2+2*Math.PI*i/N,v=sc.dIdx[k]/100;
    grid+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#e5e4de"/>';
    pts.push((cx+R*v*Math.cos(a)).toFixed(1)+","+(cy+R*v*Math.sin(a)).toFixed(1));
    var lx=cx+(R+22)*Math.cos(a),ly=cy+(R+22)*Math.sin(a),an=Math.cos(a)>.3?"start":Math.cos(a)<-.3?"end":"middle";
    lab+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+an+'" font-size="12" fill="#222634">'+DIMS[k].n+'</text>';});
  return '<svg viewBox="-35 0 490 390" style="width:100%;max-width:440px;display:block;margin:0 auto">'+grid+'<polygon points="'+pts.join(" ")+'" fill="rgba(69,79,135,.25)" stroke="#2d3561" stroke-width="2"/>'+lab+'</svg>';
}
function viewReport(){
  var r=S.result,sc=r.sc,L=LEVELS[sc.lv],keys=Object.keys(DIMS);
  var order=keys.slice().sort(function(a,b){return sc.dm[a]-sc.dm[b]||keys.indexOf(a)-keys.indexOf(b);});
  var weak=order.slice(0,3),strong=order.slice().reverse().filter(function(k){return sc.dm[k]>=6;}).slice(0,3);
  var spread=Math.max.apply(null,keys.map(function(k){return sc.dIdx[k];}))-Math.min.apply(null,keys.map(function(k){return sc.dIdx[k];}));
  var nxt=sc.lv<3?LEVELS[sc.lv+1]:null,need=nxt?Math.ceil(SV.N+nxt.min*0.03*SV.N-1e-9)-sc.total:0;
  var h='<div class="wrap wide">';
  h+='<div class="card"><div class="eyebrow">'+SV.name+'分析報告'+(CONFIG.BANK_NAME?'｜'+esc(CONFIG.BANK_NAME):'')+'</div><h2 style="margin:6px 0 10px">'+esc(S.info.name)+'　<span class="mute" style="font-size:16px;font-weight:500">'+esc(S.info.title)+'｜'+esc(S.info.company)+'</span></h2>'+
   '<div class="small mute">施測時間：'+esc(r.at)+'　作答時間：'+Math.floor(r.secs/60)+' 分 '+(r.secs%60)+' 秒　題庫版本：'+CONFIG.VERSION+'</div>'+
   (CONFIG.FEEDBACK?'<div class="str"><b>答對 '+BANK.filter(function(q){return sc.qs[q.id]===4;}).length+' ／ '+SV.N+' 題</b>（選到最佳答案的題數）；未答對題號（題庫編號）：'+(BANK.filter(function(q){return sc.qs[q.id]!==4;}).map(function(q){return q.id;}).join('、')||'無')+'</div>':'')+(r.flags.length?'<div class="warn">作答品質提示：'+esc(r.flags.join("；"))+'。本次結果僅供參考，建議重新施測。</div>':'')+'</div>';
  h+='<div class="card"><div class="hero"><div class="big">'+sc.idx.toFixed(1)+'<small> ／ 100</small></div><div><span class="badge" style="background:'+L.c+'">'+L.k+'　'+L.n+'</span>'+
   '<p style="margin:10px 0 0">'+L.d+'</p></div></div>'+
   '<div class="scale"><div class="pin" style="left:'+sc.idx+'%" data-v="'+sc.idx.toFixed(1)+'"></div><span class="tk" style="left:35%">35</span><span class="tk" style="left:60%">60</span><span class="tk" style="left:80%">80</span></div>'+
   '<table><tr><th>等級</th><th>成熟度指數</th><th>原始總分（'+SV.N+'–'+SV.N*4+'）</th></tr>'+LEVELS.map(function(l,i){return '<tr'+(i===sc.lv?' style="background:#eef0f8;font-weight:700"':'')+'><td>'+l.k+'　'+l.n+'</td><td>'+l.min+(i<3?' – '+(LEVELS[i+1].min-0.1).toFixed(1):' – 100')+'</td><td>'+l.raw+'</td></tr>';}).join("")+'</table>'+
   '<p class="small mute" style="margin:10px 0 0">計分方式：每題依選項反映的成熟度給 1–4 分，'+SV.N+' 題合計 '+SV.N+'–'+SV.N*4+' 分，換算指數＝（總分－'+SV.N+'）÷'+SV.N*3+'×100。你的原始總分為 <b>'+sc.total+' 分</b>'+(nxt?'，距離 '+nxt.k+'（'+nxt.n+'）還差 <b>'+need+' 分</b>。':'，已達最高等級。')+'</p></div>';
  h+='<div class="card"><h3>'+SV.pilTitle+'</h3><p class="small mute" style="margin:4px 0 12px">'+SV.pilSub+'</p><div class="pill3">'+Object.keys(PILLARS).map(function(p){var v=sc.pIdx[p],t=TIERS[tierOf(v)];return '<div class="p"><div class="small mute">'+PILLARS[p].n+'（'+PILLARS[p].d.length*2+' 題）</div><b>'+v.toFixed(1)+'</b> <span class="tag '+t.c+'">'+t.n+'</span><div class="bar" style="margin:8px 0"><div style="width:'+v+'%;background:var(--navy)"></div></div><div class="small mute">'+PILLARS[p].s+'</div></div>';}).join("")+'</div></div>';
  h+='<div class="card"><h3>'+SV.dimTitle+'</h3><div class="two" style="margin-top:10px"><div>'+radar(sc)+'</div><div><table><tr><th>構面</th><th class="n">得分</th><th>指數</th><th>程度</th></tr>'+keys.map(function(k){var v=sc.dIdx[k],t=TIERS[tierOf(v)];return '<tr><td>'+DIMS[k].n+'</td><td class="n">'+sc.dm[k]+'／8</td><td><div class="bar"><div style="width:'+v+'%;background:var(--sage)"></div></div><span class="small mute">'+v.toFixed(0)+'</span></td><td><span class="tag '+t.c+'">'+t.n+'</span></td></tr>';}).join("")+'</table></div></div>'+
   '<p class="small mute" style="margin:8px 0 0">構面指數＝（該構面2題合計－2）÷6×100。程度分級：&lt;25 待建立、25–57 發展中、58–91 熟練、≥92 精熟。最高與最低構面相差 <b>'+spread.toFixed(0)+'</b> 分，'+(spread>=60?'屬於落差明顯的「尖峰型」輪廓，建議優先補齊短板。':spread>=34?'輪廓中等起伏，仍有可優先補強的短板。':'各構面表現相對均衡。')+'</p></div>';
  h+='<div class="card"><h3>優勢與發展重點</h3>';
